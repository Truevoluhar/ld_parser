name: ld-parser
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8086:8080"
    volumes:
      - parser_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 20s
      timeout: 20s
      start_period: 45s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  parser_data:
